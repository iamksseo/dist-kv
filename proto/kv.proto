syntax = "proto3";

package kv;

option go_package = "dist-kv/proto";

// KV service definition
service KV {
  // Put stores a key-value pair
  rpc Put(PutRequest) returns (PutResponse);
  
  // Get retrieves the value for a given key
  rpc Get(GetRequest) returns (GetResponse);
}

// Put request message
message PutRequest {
  string key = 1;
  string value = 2;
}

// Put response message
message PutResponse {
  bool success = 1;
  string message = 2;
}

// Get request message
message GetRequest {
  string key = 1;
}

// Get response message
message GetResponse {
  bool success = 1;
  string value = 2;
  string message = 3;
}
